<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#7d1a1a"><meta name="format-detection" content="telephone=no"><title>Blood on the Clocktower</title>
<style>
:root{--glow:#fff6dcaa;--bg:#efe6d2;--fg:#2b1d14;--cd:#fbf4e3;--ac:#7d1a1a;--mu:#6e5f50;--bd:#cdb994;--gd:#1d5a96;--ev:#a31515;--gold:#9a6b1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow:#3a181288;--bg:#120d0b;--fg:#eadfcb;--cd:#1f1714;--ac:#b8322c;--mu:#a1927f;--bd:#43372d;--gd:#6aaef0;--ev:#ff7070;--gold:#d4a84b}}
:root[data-theme="dark"]{--glow:#3a181288;--bg:#120d0b;--fg:#eadfcb;--cd:#1f1714;--ac:#b8322c;--mu:#a1927f;--bd:#43372d;--gd:#6aaef0;--ev:#ff7070;--gold:#d4a84b}
html{scroll-padding-top:70px;-webkit-text-size-adjust:100%}
body{margin:0 auto;background:var(--bg) radial-gradient(ellipse at 50% 0,var(--glow),transparent 65%) fixed;color:var(--fg);font:16px/1.5 Georgia,"Times New Roman",serif;padding:8px 10px 96px;max-width:640px}
*{-webkit-tap-highlight-color:transparent}
h2{text-shadow:0 1px 0 #0003;font-size:24px;margin:6px 0;text-align:center;color:var(--gold);letter-spacing:.06em;font-variant:small-caps;border-bottom:1px solid var(--gold);padding-bottom:4px}
.card{background:var(--cd);border:1px solid var(--bd);border-left:3px solid var(--gold);border-radius:10px;padding:12px;margin:10px 0;box-shadow:0 1px 6px #0003}
button,select,input,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;margin:3px;max-width:100%;min-height:40px}
button{cursor:pointer;touch-action:manipulation}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
textarea{width:100%;box-sizing:border-box}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;flex-wrap:wrap;gap:2px;padding:4px 0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;background:var(--cd);border-top:1px solid var(--gold);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs:empty{display:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;border:0;border-top:2px solid transparent;background:none;border-radius:0;margin:0;padding:2px;min-height:50px;color:var(--mu)}
.tabs button.on{color:var(--gold);border-top-color:var(--gold);background:none}.tabs span{font-size:20px}.tabs small{font-size:11px}
.mu{color:var(--mu);font-size:14px}.g{color:var(--gd);font-weight:bold}.e{color:var(--ev);font-weight:bold}.warn{color:var(--ev);font-weight:bold}
.bn{background:var(--ac);color:#fff;padding:12px;border-radius:10px;margin:8px 0;font-weight:bold;text-align:center}
.dead{opacity:.5}.c{text-align:center}.big{font-size:26px;font-weight:bold;color:var(--gold)}
.ov{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:9;padding:20px;text-align:center;color:#fff}
.row{display:flex;flex-wrap:wrap;align-items:center}label{display:inline-block;margin:4px 10px 4px 0}
.tk{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--gd);background:var(--bg);font-size:19px;vertical-align:middle;margin-right:6px;flex:none;box-shadow:0 0 6px #1d5a9655}
.tk.M,.tk.D{border-color:var(--ev);box-shadow:0 0 6px #a3151588}
.tk.lg{width:96px;height:96px;font-size:52px;margin:8px auto;display:flex;border-width:3px}
.tk.back{border-color:var(--gold);color:var(--gold);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.seat{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:20px;padding:4px 12px;margin:3px;background:var(--bg)}
.seat.me{border-color:var(--gold);font-weight:bold}.seat.x{opacity:.5;text-decoration:line-through}
.qr{background:#fff;display:inline-block;padding:10px;border-radius:8px;margin:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:12px auto}.pad button{min-height:62px;font-size:26px}.dots{font-size:34px;letter-spacing:10px;color:var(--gold);min-height:46px}.bigb{width:86%;min-height:64px;font-size:20px;margin:8px 0}
.orn{text-align:center;color:var(--gold);letter-spacing:.6em;margin:2px 0 6px}
.hint{background:var(--cd);border:1px dashed var(--gold);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.toast{position:fixed;left:10px;right:10px;bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;padding:12px 14px;border-radius:10px;z-index:20;display:none;box-shadow:0 4px 14px #0008;font-size:15px}
.card.good{border-left-color:var(--gd)}.card.evil{border-left-color:var(--ev)}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-top:6px}.prog i{display:block;height:100%;background:var(--gold);border-radius:3px}
.sub{color:var(--mu);font-style:italic;text-align:center;margin:0 0 6px}
details summary{cursor:pointer;min-height:32px}
</style></head><body>
<h2 style="margin:4px 0">🕯️ Blood on the Clocktower</h2>

<div id="top"></div><div id="bn"></div><div id="main"></div><div id="ov"></div><div id="toast" class="toast" onclick="this.style.display='none'"></div><nav class="tabs" id="tabs"></nav>
<script>
const R={
Washerwoman:['T','Sai che 1 di 2 giocatori è un certo Townsfolk.','Mostra 2 giocatori + token Townsfolk: uno è giusto, l’altro sbagliato. La Spy può risultare Townsfolk. Se avvelenato/ubriaco puoi dare info false.'],
Librarian:['T','Sai che 1 di 2 giocatori è un certo Outsider (o 0).','Mostra 2 giocatori + token Outsider. Se non ci sono Outsider mostra 0. Il Drunk è un Outsider (non rivelare il Townsfolk che crede di essere).'],
Investigator:['T','Sai che 1 di 2 giocatori è un certo Minion.','Mostra 2 giocatori + token Minion. La Recluse può risultare Minion.'],
Chef:['T','Sai quante coppie di malvagi sono sedute vicine.','Mostra le dita (0,1,2…). Contano anche i morti per la seduta. La Recluse può contare come malvagia o no.'],
Empath:['T','Ogni notte: quanti dei 2 vicini VIVI sono malvagi.','Dopo il Demone: l’info è quella dell’alba. Ignora i morti (prende il vivo più vicino). Spy/Recluse possono variare.'],
FortuneTeller:['T','Ogni notte scegli 2 giocatori: sì se uno è Demone.','Annuisci se uno dei due è Imp o il RED HERRING (buono fisso per tutta la partita). Può scegliere morti o se stesso.'],
Undertaker:['T','Ogni notte (non la 1ª) impari chi è stato giustiziato oggi.','Svegliare solo se oggi c’è stata un’esecuzione. Se era il Drunk mostra Drunk. La Spy può registrarsi come altro.'],
Monk:['T','Ogni notte (non la 1ª) proteggi un giocatore (non te) dal Demone.','Se il Demone attacca il protetto: nessun morto, non dire perché. Non protegge dalle esecuzioni.'],
Ravenkeeper:['T','Se muori di notte scegli un giocatore: vedi il suo personaggio.','Svegliare SOLO se è morto stanotte (anche tramite Mayor). Può scegliere un morto.'],
Virgin:['T','1ª volta nominata: se il nominatore è Townsfolk viene giustiziato.','Solo Townsfolk (non Outsider/Minion/Demone). Dopo la 1ª nomination perde l’abilità anche se avvelenata. Fine nomination del giorno.'],
Slayer:['T','1 volta/partita, di giorno: scegli pubblicamente, se è il Demone muore.','Se avvelenato/ubriaco non funziona e perde comunque l’uso. La Recluse può morire se registrata come Imp. Non rivelare chi è morto.'],
Soldier:['T','Sei al sicuro dal Demone.','Il Demone che lo attacca non uccide nessuno. Muore comunque per esecuzione o se avvelenato.'],
Mayor:['T','3 vivi e nessuna esecuzione: vince il bene. Se muori di notte, può morire un altro.','Se attaccato puoi scegliere un altro morto (non Soldier/protetto: allora nessun morto). Alba: annuncia solo chi è morto.'],
Butler:['O','Ogni notte scegli un Master: domani voti solo se lui vota.','Segna il Master. Non sei tu a controllare i voti del Butler.'],
Drunk:['O','Pensi di essere un Townsfolk ma sei il Drunk.','Nessuna abilità. Svegliarlo come il Townsfolk che crede di essere e dare info false.'],
Recluse:['O','Puoi risultare malvagio e Minion/Demone, anche da morto.','Decidi tu come si registra ogni volta, scegliendo l’opzione più interessante.'],
Saint:['O','Se muori per esecuzione, il tuo team perde.','Esecuzione = vince il male (solo se sano). Se muore di notte il gioco continua.'],
Poisoner:['M','Ogni notte avveleni un giocatore (notte + giorno dopo).','Il giocatore avvelenato agisce normalmente ma senza effetto; puoi dargli info false.'],
Spy:['M','Vedi il Grimoire. Puoi registrarti come buono e Townsfolk/Outsider.','Mostrare il Grimoire tutto il tempo che serve (orientato bene).'],
ScarletWoman:['M','Con ≥5 vivi, se muore il Demone diventi il Demone.','Travellers non contano. Se il Demone muore con ≥5 vivi → diventa Imp, svegliala e mostra YOU ARE + token Imp.'],
Baron:['M','Ci sono 2 Outsider in più. [+2 Outsiders]','Setup: -2 Townsfolk, +2 Outsider. Non si annulla se muore.'],
Imp:['D','Ogni notte (non la 1ª) scegli chi muore. Se ti uccidi, un Minion diventa Imp.','Se si uccide: scegli un Minion vivo (la Scarlet Woman deve diventarlo se ≥5 vivi), svegliarlo e mostrare YOU ARE + Imp.']};
const TN={T:'Townsfolk',O:'Outsider',M:'Minion',D:'Demone'};
const ORD1=['dusk','minfo','dinfo','Poisoner','Washerwoman','Librarian','Investigator','Chef','Empath','FortuneTeller','Butler','Spy','dawn'];
const ORD2=['dusk','Poisoner','Monk','Spy','ScarletWoman','Imp','Ravenkeeper','Empath','FortuneTeller','Undertaker','Butler','dawn'];
const CNT={5:[3,0,1],6:[3,1,1],7:[5,0,1],8:[5,1,1],9:[5,2,1],10:[7,0,2],11:[7,1,2],12:[7,2,2],13:[9,0,3],14:[9,1,3],15:[9,2,3]};
const ty=r=>R[r][0], $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let DB=null,UID=null,LOB={},ACTS={},VOTES={},ISADM=false;
let FORM={},OPENS=new Set(),PENDING=0,FLUSH=()=>{};
const busy=()=>{const a=document.activeElement;return !!a&&(a.tagName==='TEXTAREA'||a.tagName==='SELECT'||(a.tagName==='INPUT'&&!['checkbox','radio','button','submit'].includes(a.type)))};
function restoreUI(sy){try{Object.keys(FORM).forEach(id=>{const e=document.getElementById(id);if(!e||e.tagName==='BUTTON')return;if(e.tagName==='SELECT'){if([...e.options].some(o=>o.value===FORM[id]))e.value=FORM[id]}else if(e.value!==FORM[id])e.value=FORM[id]});document.querySelectorAll('details').forEach(d=>{const k=(d.querySelector('summary')||{}).textContent;if(OPENS.has(k))d.open=true});if(sy)window.scrollTo(0,sy)}catch(e){}}
if(document.addEventListener){document.addEventListener('input',e=>{const t=e.target;if(t&&t.id&&t.id!=='nmx'&&t.tagName!=='BUTTON'&&t.type!=='checkbox')FORM[t.id]=t.value},true);document.addEventListener('change',e=>{const t=e.target;if(t&&t.id&&t.id!=='nmx'&&t.type!=='checkbox')FORM[t.id]=t.value;if(t&&t.tagName==='SELECT')setTimeout(()=>t.blur(),0)},true);document.addEventListener('focusout',()=>setTimeout(()=>{if(PENDING&&!busy()){PENDING=0;FLUSH()}},60),true);document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.tagName==='DETAILS'){const k=(d.querySelector('summary')||{}).textContent;if(d.open)OPENS.add(k);else OPENS.delete(k)}},true)}
let H=[],STAND=true,NETST='',PID='';const ONL=new Set();
let S;try{S=JSON.parse(localStorage.getItem('botc'))}catch(e){}
S=Object.assign({p:[],night:0,phase:'setup',noms:[],done:{},tab:'setup',sel:[],names:'',nd:[],monk:-1,bl:[],last:'',ex:0,saint:0,log:[],excl:{}},S||{});
const save=()=>{try{localStorage.setItem('botc',JSON.stringify(S))}catch(e){}};
const healthy=p=>!p.pois&&p.role!=='Drunk', evil=p=>['M','D'].includes(ty(p.role)), alive=()=>S.p.filter(p=>p.al).length;
const inRole=r=>S.p.map((p,i)=>({p,i})).filter(x=>x.p.role===r||(x.p.role==='Drunk'&&x.p.fake===r));
function nb(i){const n=S.p.length,o=[];for(const d of[-1,1]){let j=i;for(let k=0;k<n;k++){j=(j+d+n)%n;if(j!==i&&S.p[j].al){o.push(j);break}}}return o}
function rc(){H.push(JSON.stringify(S));if(H.length>40)H.shift();renderNow();save();sync()}
function setTab(t){S.tab=t;rc()}
function tg(r){const k=S.sel.indexOf(r);k<0?S.sel.push(r):S.sel.splice(k,1);rc()}
function assign(){
 const nm=S.names.split('\n').map(s=>s.trim()).filter(Boolean),sel=S.sel;
 if(nm.length<5||nm.length>15||sel.length!==nm.length){toast('Servono 5–15 giocatori e tanti ruoli selezionati quanti sono i giocatori.');return}
 if(S.p.length&&!confirm('Ricominciare una nuova partita?'))return;
 const rs=shuf([...sel]),fk=shuf(Object.keys(R).filter(r=>ty(r)==='T'&&!sel.includes(r)));
 S.p=nm.map((n,i)=>({n,role:rs[i],al:1,vu:0,pois:0,rh:0,vg:0,note:'',fake:rs[i]==='Drunk'?fk[0]:'',uid:(S.uidmap||{})[n]||''}));
 const f=S.p.some(p=>p.role==='Drunk')?1:0;
 S.bl=[...fk.slice(f,f+2),...shuf(Object.keys(R).filter(r=>ty(r)==='O'&&!sel.includes(r))).slice(0,1)];
 if(sel.includes('FortuneTeller')){const g=shuf(S.p.filter(p=>!evil(p)));if(g.length)g[0].rh=1}
 Object.assign(S,{night:0,phase:'setup',noms:[],done:{},tab:'grim',nd:[],monk:-1,last:'',ex:0,saint:0});rc()}
function rev(i){const p=S.p[i],r=p.fake||p.role;$('#ov').innerHTML=`<div class="ov" onclick="this.remove()"><div><div style="font-size:15px">${esc(p.n)}, sei:</div>${tk(r,'lg')}<h1>${nm(r)}</h1><p>${R[r][1]}</p><div class="mu">Tocca per nascondere</div></div></div>`}
function startNight(){if(S.phase==='night')return;FORM={};S.night++;S.cur=null;S.tEnd=0;S.phase='night';S.p.forEach(p=>p.pois=0);S.monk=-1;S.nd=[];rc();window.scrollTo(0,0)}
function startDay(){if(S.phase!=='night')return;FORM={};S.phase='day';S.noms=[];S.ex=0;rc();window.scrollTo(0,0)}
function kill(i,how){const p=S.p[i];p.al=0;if(how==='night')S.nd.push(i);rc()}
function setPois(i){S.p.forEach(p=>p.pois=0);if(i>=0)S.p[i].pois=1;rc()}
function monkOk(){return inRole('Monk').some(x=>x.p.al&&healthy(x.p))}
function impKill(){const i=+$('#it').value;if(!(i>=0)||!S.p[i])return;const t=S.p[i];
 if(!t.al){toast('Era già morto: non succede nulla (lascia che il giocatore lo scelga lo stesso).');return}
 if(t.role==='Soldier'&&healthy(t)){toast('Soldier sano: nessun morto stanotte.');return}
 if(S.monk===i&&monkOk()){toast('Protetto dal Monk: nessun morto.');return}
 if(t.role==='Mayor'&&healthy(t)&&confirm('Il Mayor è attaccato. OK = scegli un altro che muore al posto suo (poi “Morto” sul Grimorio; se scegli Soldier/protetto/morto nessun morto). Annulla = muore il Mayor.')){return}
 if(t.role==='Imp'){toast('L’Imp si uccide: scegli un Minion vivo e cambia il suo ruolo in Imp dal Grimorio (la Scarlet Woman DEVE diventarlo se ≥5 vivi). Svegliarlo dopo e mostrare YOU ARE + Imp.')}
 kill(i,'night')}
function addNom(by,to,v){if(by===undefined){by=+$('#nb').value;to=+$('#nt').value;v=+$('#nv').value||0}if(by<0||to<0)return;
 delete FORM.nb;delete FORM.nt;delete FORM.nv;S.noms.push({by,to,v});const t=S.p[to],b=S.p[by];
 if(t.role==='Virgin'&&!t.vg){t.vg=1;
  const spyV=b.role==='Spy'&&confirm('La Spy nomina la Vergine: registrarla come Townsfolk ed eseguirla?');if((ty(b.role)==='T'||spyV)&&healthy(t)&&!S.ex){toast('VERGINE! '+b.n+' è Townsfolk: viene giustiziato subito. Fine delle nomination di oggi. (Se è la Spy, decidi tu come si registra.)');exec(by);return}
  toast('Vergine nominata: perde l’abilità. Il nominatore ('+b.role+') '+(healthy(t)?'non è Townsfolk: nessun effetto, si vota normalmente.':'—Vergine avvelenata/ubriaca: nessun effetto.'))}
 rc()}
function exec(i){if(S.ex){toast('Una sola esecuzione al giorno.');return}const p=S.p[i];S.ex=1;S.last=p.role;p.al=0;
 if(p.role==='Saint'&&healthy(p))S.saint=1;rc()}
function win(){if(!S.p.length)return'';const a=alive(),imp=S.p.some(p=>p.al&&p.role==='Imp');
 if(S.saint)return'⚖️ Il Saint è stato giustiziato: VINCE IL MALE';
 if(!imp){const sw=S.p.some(p=>p.al&&p.role==='ScarletWoman'&&healthy(p));
  return sw&&a>=4?'⚠️ L’Imp è morto ma la Scarlet Woman (≥5 vivi prima) diventa Imp: cambia il suo ruolo. Il gioco continua.':'🎉 L’Imp è morto: VINCE IL BENE'}
 if(a<=2)return'💀 Restano 2 vivi: VINCE IL MALE';
 if(a===3&&S.phase==='day'&&inRole('Mayor').some(x=>x.p.al&&healthy(x.p)))return'🏛️ 3 vivi e c’è il Mayor: se oggi nessuno viene giustiziato, VINCE IL BENE';return''}
const opts=(f,sel)=>S.p.map((p,i)=>f(p,i)?`<option value="${i}"${sel===i?' selected':''}>${esc(p.n)}</option>`:'').join('');
function vSetup(){
 const n=S.names.split('\n').map(s=>s.trim()).filter(Boolean).length,c=CNT[n],need=c?[...c]:[0,0,0];
 if(S.sel.includes('Baron')){need[0]-=2;need[1]+=2}
 const cnt=t=>S.sel.filter(r=>ty(r)===t).length;
 let h=`<div class="card"><b>1. Giocatori</b> (uno per riga, in ordine di seduta orario)<textarea id="nmx" rows="6" oninput="S.names=this.value" onchange="S.names=this.value;rc()">${esc(S.names)}</textarea><div class="mu">${n} giocatori ${c?'':'(servono 5–15)'}</div></div><div class="card"><b>2. Ruoli</b> ${c?`<div class="mu">Servono: ${need[0]} Townsfolk · ${need[1]} Outsider · ${need[2]} Minion · 1 Demone (Baron: −2 Townsfolk, +2 Outsider)</div>`:''}`;
 ['T','O','M','D'].forEach((t,k)=>{h+=`<div><b>${TN[t]}</b> ${cnt(t)}/${k<3?need[k]:1}<br>`+Object.keys(R).filter(r=>ty(r)===t).map(r=>`<label><input type="checkbox" ${S.sel.includes(r)?'checked':''} onchange="tg('${r}')">${IC[r]} ${nm(r)}</label>`).join('')+'</div>'});
 h+=`<button onclick="autoSel()">✨ Suggerisci ruoli</button><button class="on" onclick="assign()">🎲 Assegna a caso e crea Grimorio</button></div>`;
 if(S.p.length)h+=`<div class="card"><b>3. Distribuzione segreta</b><div class="mu">Passa il telefono: ogni giocatore tocca il proprio nome e legge il suo ruolo (il Drunk vede il Townsfolk finto).</div>`+S.p.map((p,i)=>`<button onclick="rev(${i})">👁 ${esc(p.n)}</button>`).join('')+`<div class="mu" style="margin-top:6px">Bluff per il Demone (non in gioco): <b>${S.bl.join(', ')}</b></div></div>`;
 return h}
function vGrim(){if(!S.p.length)return'<div class="card">Crea prima la partita in “Setup”.</div>';
 return bluffCard()+gridTools()+(S.circ?vCircle():'')+notesCard()+S.p.map((p,i)=>{const t=ty(p.role);return`<div class="card ${evil(p)?'evil':'good'} ${p.al?'':'dead'}"><div class="row">${tk(p.role)}<b>${i+1}. ${esc(p.n)}</b> ${p.uid?(ONL.has(p.uid)?'🟢':'⚪'):''}&nbsp;<span class="${evil(p)?'e':'g'}">${TN[t]}</span><select onchange="S.p[${i}].role=this.value;rc()">${Object.keys(R).map(r=>`<option${r===p.role?' selected':''}>${r}</option>`).join('')}</select>${p.role==='Drunk'?`pensa:<select onchange="S.p[${i}].fake=this.value;rc()">${Object.keys(R).filter(r=>ty(r)==='T').map(r=>`<option${r===p.fake?' selected':''}>${r}</option>`).join('')}</select>`:''}</div>
<div class="row"><button class="${p.al?'':'on'}" onclick="tgAl(${i})">${p.al?'Vivo':'Morto'}</button><button class="${p.vu?'on':''}" onclick="S.p[${i}].vu=${p.vu?0:1};rc()">${p.vu?'Voto usato':'Voto ok'}</button><button class="${p.pois?'on':''}" onclick="S.p[${i}].pois=${p.pois?0:1};rc()">☠ Avvelenato</button><button class="${p.rh?'on':''}" onclick="S.p[${i}].rh=${p.rh?0:1};rc()">Red Herring</button>${p.uid?`<button onclick="msgTo(${i})">📨</button>`:''}</div>
<input style="width:94%" placeholder="Note / reminder" value="${esc(p.note)}" onchange="S.p[${i}].note=this.value;save()"></div>`}).join('')}

function pinKey(k){if(k==='b'){PINV=PINV.slice(0,-1);drawPin('');return}if(PINV.length>=4)return;PINV+=k;if(PINV.length<4){drawPin('');return}if(PINV===PIN)pickRole('s');else{PINV='';drawPin('PIN errato, riprova')}}
